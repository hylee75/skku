<script>
/* ================= 유틸 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const run = (fn, ...a) => new Promise((ok, no) => {
  const r = google.script.run.withSuccessHandler(ok).withFailureHandler(e => no(e));
  r[fn](...a);
});
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

const VAL = ['인', '의', '예', '지'];
const VI = {
  인: { hj: '仁', n: '배려', k: 'In_Score', c: '#c9574c' },
  의: { hj: '義', n: '책임', k: 'Ui_Score', c: '#2f6aa8' },
  예: { hj: '禮', n: '소통', k: 'Ye_Score', c: '#8d5fae' },
  지: { hj: '智', n: '문제해결', k: 'Ji_Score', c: '#16845f' }
};
const LEVELS = [[0, '기초 탐구자'], [40, '능동적 실천가'], [80, '심화 문제해결사'], [120, '가치 창출자'], [150, '정복자/마스터']];
const MASTER = { 지: '실천지 정복자', 인: '어진 마음의 정복자', 의: '정의 정복자', 예: '예법 정복자' };
const PERSONA = { 인의: '공감적 정의수호가', 인예: '포용적 관계수호자', 인지: '자비로운 통찰자', 의예: '품격있는 원칙주의자', 의지: '합리적 결단자', 예지: '유연한 처세술자', 인의지: '현학적 리더' };
const CAT = { role: '역할', tool: '도구', method: '방법론 / 실무기법', trouble: '문제해결 / 트러블슈팅' };
const LIMIT = { role: 3, trouble: 2 };

const S = { cfg: null, profile: null, records: [], notices: [], seniors: [], rm: null, flat: {},
  sem: '2026-1', view: 'all', sub: 'feed', filter: 'all', chart: null,
  f: null, sel: null, conn: { on: false, type: 'solid', first: null } };

/* ================= 태그/점수 헬퍼 ================= */
const tagName = t => String(t).split('@')[0];
function tagInfo(t) {
  if (S.flat[t]) return S.flat[t];
  if (String(t).includes('@')) { const [n, v] = t.split('@'); return { v, d: n, n }; }
  return null;
}
const splitTags = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const recTags = r => [r.Role_Tags, r.Tool_Tags, r.Method_Tags, r.Trouble_Tags].flatMap(splitTags);
const scoped = () => S.view === 'all' ? S.records : S.records.filter(r => r.Semester_ID === S.sem);
function agg(recs) { const o = { 인: 0, 의: 0, 예: 0, 지: 0 }; recs.forEach(r => VAL.forEach(v => o[v] += Number(r[VI[v].k]) || 0)); return o; }
const level = p => LEVELS.reduce((l, x, i) => p >= x[0] ? i + 1 : l, 1);
const careerOf = () => S.cfg.careers[S.profile.career] || S.cfg.careers['기업 취업'];
const targetOf = v => careerOf().core.includes(v) ? 120 : 80;
function persona(sc) {
  const good = VAL.filter(v => sc[v] >= 40).sort((a, b) => sc[b] - sc[a]);
  if (good.length < 2) return { ico: '🌱', key: '', title: '성장 준비 중인 탐구자' };
  if (good.length === 3 && !good.includes('예')) return { ico: '🏆', key: '인+의+지', title: PERSONA['인의지'] };
  const two = good.slice(0, 2).sort((a, b) => VAL.indexOf(a) - VAL.indexOf(b));
  return { ico: '🏆', key: two.join('+'), title: PERSONA[two.join('')] };
}
const ddays = d => Math.round((new Date(d + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
const semOrder = r => S.cfg.semesters.indexOf(r);

/* ================= 부트 ================= */
async function init() {
  try {
    const d = await run('getBootstrap');
    Object.assign(S, { cfg: d.config, profile: d.profile, records: d.records, notices: d.notices, seniors: d.seniors, rm: d.roadmap });
    Object.entries(S.cfg.tags).forEach(([cat, arr]) => arr.forEach(([n, v, dt]) => S.flat[n] = { v, d: dt, n, cat }));
    $('#semSel').innerHTML = S.cfg.semesters.map(s => `<option ${s === S.sem ? 'selected' : ''}>${s}</option>`).join('');
    resetForm(); buildForm(); header(); renderAll();
    $('#boot').remove();
  } catch (e) { $('#boot').innerHTML = '불러오지 못했어요.<br><small>' + esc(e.message || e) + '</small>'; }
}
function header() {
  $('#hName').textContent = S.profile.name;
  $('#hCareer').textContent = '목표 진로 · ' + S.profile.career;
  $('#hCnt').textContent = '누적 ' + S.records.length + '건';
}
function renderAll() { renderDash(); drawChips(); renderRoad(); renderFind(); }
function go(t) {
  $$('.tab').forEach(e => e.classList.toggle('on', e.id === 'tab-' + t));
  $$('.bar button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'dash') renderDash(); if (t === 'road') renderRoad(); if (t === 'find') renderFind();
  window.scrollTo(0, 0);
}

/* ================= Tab 1 · 대시보드 ================= */
function renderDash() {
  const recs = scoped(), sc = agg(recs), car = careerOf();
  const k = S.view === 'all' ? 1 : .3;
  const peer = {}; VAL.forEach(v => peer[v] = Math.round(car.peer[v] * k));
  const p = persona(sc);
  const weak = VAL.slice().sort((a, b) => sc[a] / targetOf(a) - sc[b] / targetOf(b))[0];
  const rec = S.notices.filter(n => n.tags.some(t => t.startsWith('#' + weak + '_')) && n.grades.includes(Number(S.profile.grade)))
    .sort((a, b) => a.deadline.localeCompare(b.deadline))[0];

  $('#tab-dash').innerHTML = `
  <div class="row between" style="margin-bottom:12px">
    <h2>성장 진단</h2>
    <div class="seg" style="min-width:210px">
      <button data-act="view" data-v="all" class="${S.view === 'all' ? 'on' : ''}">전체 누적</button>
      <button data-act="view" data-v="sem" class="${S.view === 'sem' ? 'on' : ''}">${esc(S.sem)} 학기</button>
    </div>
  </div>
  <div class="persona"><div class="ico">${p.ico}</div><div>
    <small>핵심 페르소나</small>
    <div class="big">${p.key ? '[' + p.key.replace(/\+/g, '+') + ' 달성] ' : ''}${esc(p.title)}</div>
    <small>${recs.length}건의 기록 · 각 가치 40pt 이상부터 칭호가 열립니다</small></div></div>
  ${rec ? `<div class="gap"><span style="font-size:22px">🧭</span><div><small>가장 보완이 필요한 가치 · ${VI[weak].hj} ${weak}</small><br>
    <b>[${esc(rec.title)} / ${esc(rec.tags.filter(t => t.startsWith('#' + weak + '_')).join(' '))}]</b> <small>D-${Math.max(0, ddays(rec.deadline))}</small></div></div>` : ''}
  <div class="card">
    <div class="chartbox"><canvas id="radar" aria-label="인의예지 레이더 차트"></canvas></div>
    <div class="legend"><span><i></i>나</span><span><i class="d"></i>${esc(S.profile.career)} 학우 평균${S.view === 'sem' ? '(학기 환산)' : ''}</span></div>
    <div class="axes">${VAL.map(v => `<button data-act="axis" data-v="${v}"><b style="color:${VI[v].c}">${VI[v].hj}</b>${v}-${VI[v].n}</button>`).join('')}</div>
    <small style="display:block;text-align:center;margin-top:6px">축을 눌러 세부 태그와 과거 회고를 확인하세요</small>
  </div>
  <div class="card"><h3 style="margin-bottom:4px">4대 성균 가치</h3>${VAL.map(v => {
    const t = targetOf(v), lv = level(sc[v]), pct = Math.min(100, Math.round(sc[v] / t * 100));
    return `<div class="val"><div class="stamp" style="background:${VI[v].c}">${VI[v].hj}</div><div>
      <div><b>${v}(${VI[v].hj})</b><span class="lv">Lv.${lv} ${LEVELS[lv - 1][1]}</span>${car.core.includes(v) ? '<span class="lv" style="background:var(--gl);color:var(--g2)">목표 역량</span>' : ''}</div>
      <div class="gauge"><span style="width:${pct}%;background:${VI[v].c}"></span></div>
      <small>${sc[v]}/${t}pt · 달성률 ${pct}%${lv === 5 ? ' · ' + MASTER[v] : ''}</small></div></div>`;
  }).join('')}</div>`;
  drawRadar(sc, peer);
}
function drawRadar(sc, peer) {
  if (S.chart) S.chart.destroy();
  const g = getComputedStyle(document.documentElement);
  const max = Math.max(120, ...VAL.map(v => Math.max(sc[v], peer[v]))) + 10;
  const txt = g.getPropertyValue('--ink').trim(), mute = g.getPropertyValue('--line').trim();
  S.chart = new Chart($('#radar'), {
    type: 'radar',
    data: {
      labels: VAL.map(v => `${v}(${VI[v].hj}) ${VI[v].n}`),
      datasets: [
        { label: '나', data: VAL.map(v => sc[v]), borderColor: '#0b4a3a', backgroundColor: 'rgba(11,74,58,.22)', borderWidth: 2.5, pointBackgroundColor: '#0b4a3a', pointRadius: 5 },
        { label: '학우 평균', data: VAL.map(v => peer[v]), borderColor: '#a88b3d', backgroundColor: 'rgba(168,139,61,.06)', borderDash: [6, 5], borderWidth: 2, pointRadius: 3 }
      ]
    },
    options: {
      maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { r: { min: 0, max, ticks: { display: false }, grid: { color: mute }, angleLines: { color: mute }, pointLabels: { color: txt, font: { size: 13, weight: '600' } } } },
      onClick: (e, _, ch) => { const pts = ch.getElementsAtEventForMode(e, 'nearest', { intersect: false }, true); if (pts.length) openAxis(VAL[pts[0].index]); }
    }
  });
}
/* 드릴다운: 축 → 세부 태그(바텀시트) → STAR 기록(모달) */
function openAxis(v) {
  const cnt = {};
  scoped().forEach(r => { const seen = new Set(); recTags(r).forEach(t => { const i = tagInfo(t); if (i && i.v === v) seen.add(i.d); }); seen.forEach(d => cnt[d] = (cnt[d] || 0) + 1); });
  const rows = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  $('#sheet').innerHTML = `<h3>${v}(${VI[v].hj}) · 세부 태그</h3><small>${S.view === 'all' ? '전체 누적' : S.sem}</small>` +
    (rows.length ? rows.map(([d, n]) => `<button class="li" data-act="detail" data-v="${v}" data-d="${esc(d)}"><span>#${esc(d)}</span><b>${n}건 ›</b></button>`).join('')
      : '<div class="empty" style="margin-top:12px">아직 이 가치의 기록이 없어요.<br>3분 기록에서 첫 회고를 남겨보세요.</div>');
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
}
function recCard(r) {
  return `<div class="star-rec"><div class="row between"><b>[${esc(r.Semester_ID)}/${esc(r.Activity_Type)}] ${esc(r.Activity_Name)}</b>
    <button data-act="bm" data-id="${r.Record_ID}" aria-label="북마크" style="font-size:20px">${r.is_bookmarked ? '★' : '☆'}</button></div>
    <ul>${[['S', r.S_Situation], ['T', r.T_Task], ['A', r.A_Action], ['R', r.R_Result], ['Reflection', r.Reflection]].filter(x => x[1]).map(x => `<li><b>${x[0]}</b>${esc(x[1])}</li>`).join('')}</ul></div>`;
}
function openRecs(v, d) {
  const list = scoped().filter(r => recTags(r).some(t => { const i = tagInfo(t); return i && i.v === v && i.d === d; }));
  $('#modal').innerHTML = `<div class="row between"><h3>#${esc(v + '_' + d)}</h3><button class="btn sm ghost" data-act="closeAll">닫기</button></div>${list.map(recCard).join('') || '<div class="empty">기록이 없어요.</div>'}`;
  $('#modal').classList.add('on'); $('#scrim').classList.add('on');
}
function closeAll() { ['#sheet', '#modal', '#scrim'].forEach(s => $(s).classList.remove('on')); }

/* ================= Tab 2 · 3분 기록 ================= */
function resetForm() { S.f = { type: '수업/과제', sel: { role: [], tool: [], method: [], trouble: [] }, primary: null, manual: false }; }
function buildForm() {
  $('#tab-rec').innerHTML = `
  <h2>3분 키워드 기록</h2><small>태그를 고르고 한 줄씩 적으면 STAR 포트폴리오가 쌓여요.</small>
  <div class="card" style="margin-top:12px">
    <label class="l">활동 구분</label>
    <div class="seg" id="fType" style="overflow-x:auto">${Object.keys(S.cfg.types).map(t => `<button data-act="type" data-t="${t}">${t}</button>`).join('')}</div>
    <label class="l">활동명 <small>목록에서 고르거나 직접 입력</small></label>
    <input type="text" id="fName" list="fNames" maxlength="120" placeholder="예: 소비자 분석 학회">
    <datalist id="fNames"></datalist>
    <div class="recbar" id="fRec"></div>
    <label class="l">후속 활동으로 이어지나요? <small>(선택) 이전 활동 연결</small></label>
    <select class="f" id="fParent"></select>
  </div>
  <div class="card" id="fChips"></div>
  <div class="card">
    <label class="l" style="margin-top:0">상황 (S) <small>참여 배경/동기</small></label>
    <textarea id="fS" placeholder="어떤 계기로 참여하게 되었나요? 예: 학회에서 소비자 데이터 분석 프로젝트에 참여함"></textarea>
    <label class="l">과제 (T) <small>달성하려 했던 목표</small></label>
    <textarea id="fT" placeholder="해결해야 했던 핵심 문제는? 예: 20대 타깃 구매 전환율 감소 원인 규명"></textarea>
    <label class="l">행동 (A) <small>실제로 한 일과 툴</small></label>
    <textarea id="fA" placeholder="본인이 맡은 구체적 행동은? 예: SPSS 설문 데이터를 교차 분석하고 유의성 검정 수행"></textarea>
    <label class="l">성과 (R) <small>정량/정성 성과</small></label>
    <textarea id="fR" placeholder="결과물이나 수치는? 예: 이탈 요인 3가지 도출 및 학회 최우수 발표 선정"></textarea>
    <label class="l">성찰 (Reflection) <small>배운 점 / 보완할 점</small></label>
    <textarea id="fF" placeholder="다음에 적용할 점은? 예: 설문 문항 설계 단계에서 표본 편향을 방지할 검증 절차 필요"></textarea>
    <button class="btn ghost sm" style="margin-top:10px" data-act="coach" id="coachBtn">✨ AI 코칭 받기</button>
    <div id="coachOut"></div>
  </div>
  <div class="prev" id="fPrev"></div>
  <div class="card"><label class="l" style="margin-top:0">대표 성균 가치 <small>자동 추천 · 눌러서 최종 확정</small></label>
    <div class="pickv" id="fPick"></div><div id="fPickTags" style="margin-top:8px"></div></div>
  <button class="btn" data-act="submit" id="submitBtn">포트폴리오 저장하기</button>`;
  drawForm();
}
function allSel() { const s = S.f.sel; return [...s.role, ...s.tool, ...s.method, ...s.trouble]; }
function calcForm() {
  const sc = { 인: 0, 의: 0, 예: 0, 지: 0 };
  allSel().forEach(t => { const i = tagInfo(t); if (i) sc[i.v] += 10; });
  const names = allSel().map(tagName);
  const hits = S.cfg.combos.filter(c => c.need.every(n => names.includes(n)));
  const rec = hits.map(h => h.v);
  const top = VAL.filter(v => sc[v] > 0).sort((a, b) => sc[b] - sc[a])[0];
  if (top && !rec.includes(top)) rec.push(top);
  return { sc, hits, rec };
}
function drawForm() {
  $$('#fType button').forEach(b => b.classList.toggle('on', b.dataset.t === S.f.type));
  const T = S.cfg.types[S.f.type];
  $('#fRec').innerHTML = '추천 역량 · ' + T.rec.map(t => `<b>${t}</b>`).join(' ');
  const past = [...new Set(S.records.filter(r => r.Activity_Type === S.f.type).map(r => r.Activity_Name))];
  $('#fNames').innerHTML = [...new Set([...T.names, ...past])].map(n => `<option value="${esc(n)}">`).join('');
  $('#fParent').innerHTML = '<option value="">없음 (첫 활동)</option>' + S.records.slice().reverse().map(r => `<option value="${r.Record_ID}">[${esc(r.Semester_ID)}] ${esc(r.Activity_Name)}</option>`).join('');
  drawChips();
}
function drawChips() {
  const box = $('#fChips'); if (!box || !S.f) return;
  const custom = allSel().filter(t => String(t).includes('@'));
  box.innerHTML = Object.keys(CAT).map(cat => `<label class="l" style="${cat === 'role' ? 'margin-top:0' : ''}">${CAT[cat]} <small>${LIMIT[cat] ? '최대 ' + LIMIT[cat] + '개' : '선택'}</small></label>
    <div class="chips">${S.cfg.tags[cat].map(([n]) => `<button class="chip ${S.f.sel[cat].includes(n) ? 'on' : ''}" data-act="chip" data-c="${cat}" data-n="${esc(n)}">${esc(n)}</button>`).join('')}
    ${cat === 'method' ? custom.map(t => `<button class="chip on" data-act="chip" data-c="method" data-n="${esc(t)}">${esc(tagName(t))}</button>`).join('') + '<button class="chip add" data-act="custom">+ 직접 추가</button>' : ''}</div>`).join('');
  const { sc, hits, rec } = calcForm();
  const plus = VAL.filter(v => sc[v] > 0).map(v => `${v} +${sc[v]}pt`).join(', ');
  $('#fPrev').innerHTML = plus ? `이번 기록으로 <b>${plus}</b>` : '태그를 고르면 인·의·예·지 가산 점수가 계산돼요';
  if (!S.f.manual) S.f.primary = rec[0] || null;
  $('#fPick').innerHTML = VAL.map(v => `<button data-act="primary" data-v="${v}" class="${S.f.primary === v ? 'on' : ''}">${VI[v].hj} ${v}${rec.includes(v) ? ' ·추천' : ''}</button>`).join('');
  $('#fPickTags').innerHTML = hits.map(h => h.tags.map(t => `<span class="tg v-${h.v}">${t}</span>`).join('')).join('');
}
async function submit() {
  const name = $('#fName').value.trim();
  if (!name) return toast('활동명을 입력해 주세요');
  if (!allSel().length) return toast('태그를 1개 이상 선택해 주세요');
  const { sc } = calcForm(), s = S.f.sel, btn = $('#submitBtn');
  btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const row = await run('saveRecord', {
      Semester_ID: S.sem, Activity_Type: S.f.type, Activity_Name: name,
      Role_Tags: s.role, Tool_Tags: s.tool, Method_Tags: s.method, Trouble_Tags: s.trouble,
      S_Situation: $('#fS').value, T_Task: $('#fT').value, A_Action: $('#fA').value, R_Result: $('#fR').value, Reflection: $('#fF').value,
      In_Score: sc.인, Ui_Score: sc.의, Ye_Score: sc.예, Ji_Score: sc.지,
      Primary_Value: S.f.primary || '', parent_record_id: $('#fParent').value
    });
    S.records.push(row); header(); resetForm(); buildForm(); toast('저장했어요 · 대시보드에 반영됐습니다');
    go('dash');
  } catch (e) { toast(e.message || '저장에 실패했어요'); }
  btn.disabled = false; btn.textContent = '포트폴리오 저장하기';
}
async function coach() {
  const b = $('#coachBtn'); b.disabled = true; b.textContent = '코칭 중…';
  try {
    const r = await run('coachStar', { name: $('#fName').value, S: $('#fS').value, T: $('#fT').value, A: $('#fA').value, R: $('#fR').value, F: $('#fF').value });
    $('#coachOut').innerHTML = `<div class="coach"><b>${esc(r.summary)}</b><ul>${r.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>${r.rewrite_R ? `<small>성과(R) 제안</small><br>${esc(r.rewrite_R)}` : ''}</div>`;
  } catch (e) { toast(e.message || 'AI 코칭에 실패했어요'); }
  b.disabled = false; b.textContent = '✨ AI 코칭 받기';
}

/* ================= Tab 3 · 로드맵 ================= */
let rmT;
function saveRm() { clearTimeout(rmT); rmT = setTimeout(() => run('saveRoadmap', JSON.stringify(S.rm)).catch(e => toast(e.message || '로드맵 저장 실패')), 600); }
const nodeById = id => S.rm.nodes.find(n => n.id === id);
const goalTags = () => (S.profile.goalTags || []).map(g => g.replace(/^#/, ''));
function nodeGoalHits(n) { const g = goalTags(); return (n.tags || []).filter(t => g.includes(tagName(t))).length; }
const msLabel = r => `[${r.Semester_ID}/${r.Activity_Type}] ${r.Activity_Name}`;

function renderRoad() {
  const rm = S.rm, placed = new Set(rm.nodes.filter(n => n.recId).map(n => n.recId));
  const items = [
    ...S.records.filter(r => !placed.has(r.Record_ID)).map(r => ({ k: 'rec', id: r.Record_ID, label: msLabel(r), plan: false })),
    ...rm.nodes.filter(n => !n.sem).map(n => ({ k: 'node', id: n.id, label: `[예정/${n.cat}] ${n.title}`, plan: true }))
  ];
  const sems = S.cfg.semesters;
  $('#tab-road').innerHTML = `
  <div class="row between"><h2>나만의 성장 로드맵</h2>
    <select class="f" id="startSel" style="width:auto" aria-label="진로 시작점">${Object.keys(S.cfg.careers).map(c => `<option ${c === rm.career ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
  <div class="tools">
    <button class="btn sm ${S.conn.on ? 'gold' : 'ghost'}" data-act="connToggle">${S.conn.on ? '연결 중… (두 활동을 차례로 탭)' : '🔗 활동 연결하기'}</button>
    <div class="seg" style="min-width:190px"><button data-act="linkType" data-t="solid" class="${S.conn.type === 'solid' ? 'on' : ''}">━ 필수(실선)</button><button data-act="linkType" data-t="dashed" class="${S.conn.type === 'dashed' ? 'on' : ''}">┅ 시너지(점선)</button></div>
  </div>
  <div class="rm-wrap">
    <div class="inbox"><small>미연결 활동함<br>끌어다 놓거나 탭 → 학기 선택</small><div style="margin-top:6px">
      ${items.map(i => `<button class="ms ${i.plan ? 'plan' : ''} ${S.sel && S.sel.id === i.id ? 'sel' : ''}" draggable="true" data-drag="${i.k}:${i.id}" data-act="selMs" data-k="${i.k}" data-id="${i.id}">${esc(i.label)}</button>`).join('') || '<small>모든 활동이 배치됐어요</small>'}</div></div>
    <div class="rm-scroll"><div class="rm-inner" id="rmInner">
      <div class="rm-start">${esc(rm.career)}<br>시작</div>
      ${sems.map((s, i) => `<div class="col" style="--i:${i}" data-sem="${s}"><button class="col-h" data-act="place" data-sem="${s}">${s}</button><div class="rm-col-nodes">
        ${rm.nodes.filter(n => n.sem === s).map(n => `<div class="node ${n.kind === 'plan' ? 'plan' : ''} ${nodeGoalHits(n) >= 2 ? 'hl' : ''} ${S.conn.first === n.id || (S.sel && S.sel.id === n.id) ? 'pick' : ''}" role="button" tabindex="0" draggable="true" data-drag="node:${n.id}" data-nid="${n.id}" data-act="nodeClick" data-id="${n.id}">${esc(n.title)}<small>${(n.tags || []).slice(0, 2).map(t => '#' + esc(tagName(t))).join(' ')}</small><span class="x" data-act="rmNode" data-id="${n.id}" aria-label="로드맵에서 빼기">✕</span></div>`).join('')}
      </div></div>`).join('')}
      <div class="rm-arrow"></div>
      <svg id="rmSvg"></svg>
    </div></div>
  </div>
  <h3 style="margin:16px 0 4px">연결 스토리</h3>
  ${rm.links.map((l, i) => nodeById(l.a) && nodeById(l.b) ? `<div class="story">${l.t === 'solid' ? '━' : '┅'} ${esc(story(l))} <button data-act="rmLink" data-i="${i}" style="color:var(--mute)">삭제</button></div>` : '').join('') || '<div class="empty">활동을 연결하면 인과 스토리가 자동으로 만들어져요.</div>'}
  <h3 style="margin:20px 0 8px">목표 역량별 타임라인</h3>${timelineHtml()}`;
  requestAnimationFrame(drawLinks);
}
function story(l) {
  const a = nodeById(l.a), b = nodeById(l.b);
  const [x, y] = semOrder(a.sem) <= semOrder(b.sem) ? [a, b] : [b, a];
  const t = (x.tags && x.tags[0]) ? tagName(x.tags[0]) : '핵심';
  return `${x.title}(원인)를 통해 #${t} 역량을 얻고, ${y.title}(목표)로 ${l.t === 'solid' ? '이어졌습니다' : '확장되었습니다'}.`;
}
function drawLinks() {
  const inner = $('#rmInner'), svg = $('#rmSvg'); if (!inner || !svg) return;
  const ir = inner.getBoundingClientRect();
  svg.setAttribute('width', inner.scrollWidth); svg.setAttribute('height', inner.scrollHeight);
  svg.innerHTML = S.rm.links.map(l => {
    const a = $(`[data-nid="${l.a}"]`), b = $(`[data-nid="${l.b}"]`); if (!a || !b) return '';
    const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
    const x1 = ar.left + ar.width / 2 - ir.left, y1 = ar.top + ar.height / 2 - ir.top, x2 = br.left + br.width / 2 - ir.left, y2 = br.top + br.height / 2 - ir.top;
    const cy = Math.min(y1, y2) - 30;
    return `<path d="M${x1},${y1} Q${(x1 + x2) / 2},${cy} ${x2},${y2}" fill="none" stroke="${l.t === 'solid' ? '#0b4a3a' : '#a88b3d'}" stroke-width="2.5" ${l.t === 'dashed' ? 'stroke-dasharray="7 6"' : ''} opacity=".85"/>`;
  }).join('');
}
function timelineHtml() {
  let goals = goalTags();
  if (!goals.length) { const f = {}; S.records.forEach(r => recTags(r).forEach(t => { const n = tagName(t); f[n] = (f[n] || 0) + 1; })); goals = Object.entries(f).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]); }
  if (!goals.length) return '<div class="empty">기록이 쌓이면 목표 역량별 타임라인이 만들어져요.</div>';
  const match = (r, g) => recTags(r).some(t => tagName(t) === g || (tagInfo(t) && tagInfo(t).d === g));
  const sorted = S.records.slice().sort((a, b) => semOrder(a.Semester_ID) - semOrder(b.Semester_ID) || String(a.Timestamp).localeCompare(b.Timestamp));
  return goals.map(g => {
    const list = sorted.filter(r => match(r, g)), ids = new Set(list.map(r => r.Record_ID));
    return `<details class="acc" open><summary>■ #${esc(g)} <small>${list.length}건</small></summary><div class="tl">${list.map(r => {
      const hit = goals.filter(x => match(r, x)).length >= 2, child = r.parent_record_id && ids.has(r.parent_record_id);
      return `<div class="it ${child ? 'f' : ''} ${hit ? 'hl' : ''}">${child ? '└─> [후속] ' : ''}[${esc(r.Semester_ID)} / ${esc(r.Activity_Type)} / ${esc(r.Activity_Name)}]${hit ? ' <span class="tg v-지">역량 연계 활동</span>' : ''}</div>`;
    }).join('') || '<small>해당 태그의 기록이 아직 없어요.</small>'}</div></details>`;
  }).join('');
}
function placeAt(sem) {
  if (!S.sel) return;
  if (S.sel.k === 'rec') {
    const r = S.records.find(x => x.Record_ID === S.sel.id); if (!r) return;
    S.rm.nodes.push({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), recId: r.Record_ID, title: r.Activity_Name, cat: r.Activity_Type, sem, kind: 'rec', tags: [...new Set(recTags(r).map(tagName))].slice(0, 4) });
  } else { const n = nodeById(S.sel.id); if (n) n.sem = sem; }
  S.sel = null; saveRm(); renderRoad();
}

/* ================= Tab 4 · 탐색 · 공지 ================= */
function renderFind() {
  const sub = `<div class="seg" style="margin-bottom:12px"><button data-act="sub" data-s="feed" class="${S.sub === 'feed' ? 'on' : ''}">개인 맞춤 공지 피드</button><button data-act="sub" data-s="senior" class="${S.sub === 'senior' ? 'on' : ''}">선배 성장 스토리</button></div>`;
  $('#tab-find').innerHTML = sub + (S.sub === 'feed' ? feedHtml() : seniorHtml());
}
function feedHtml() {
  const goals = goalTags(), g = Number(S.profile.grade);
  const matchTag = n => n.tags.find(t => goals.some(x => t.includes(x)));
  let list = S.notices.filter(n => n.grades.includes(g)).filter(n => ddays(n.deadline) >= 0);
  if (S.filter === 'mine') list = list.filter(matchTag);
  if (S.filter === 'd7') list = list.filter(n => ddays(n.deadline) <= 7);
  if (S.filter === 'urp') list = list.filter(n => n.type === 'URP' || n.source.includes('성균융합원'));
  list.sort((a, b) => (!!matchTag(b) - !!matchTag(a)) || a.deadline.localeCompare(b.deadline));
  const chips = [['all', '#전체'], ['mine', '#내로드맵맞춤'], ['d7', '#D-7임박'], ['urp', '#URP']];
  return `<div class="chips" style="margin-bottom:12px">${chips.map(([k, l]) => `<button class="chip ${S.filter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div>` +
    (list.map(n => {
      const d = ddays(n.deadline), m = matchTag(n);
      return `<div class="card notice"><div class="dd ${d <= 7 ? 'hot' : ''}">D-${d}</div><div>
        <b>${esc(n.title)}</b>
        <div class="why">${m ? '★ 목표 역량 ' + esc(m) + ' 일치 · 최상단 추천' : esc(n.source) + ' · 기본 추천 태그'}</div>
        <div>${n.tags.map(t => `<span class="tg ${VAL.includes(t[1]) ? 'v-' + t[1] : ''}">${esc(t)}</span>`).join('')}</div>
        <div class="row" style="margin-top:6px"><a href="${esc(n.url)}" target="_blank" rel="noopener" class="btn sm ghost" style="text-decoration:none">원문 링크 ›</a>
        <button class="btn sm" data-act="addPlan" data-id="${n.id}">+ 로드맵 담기</button></div></div></div>`;
    }).join('') || '<div class="empty">조건에 맞는 공지가 없어요.<br>다른 필터를 눌러 보세요.</div>');
}
function seniorHtml() {
  return S.seniors.map(s => `<div class="card"><h3>${esc(s.title)}</h3><small>${esc(s.sub)}</small>
    <div class="mix">${Object.entries(s.mix).map(([v, p]) => `<span style="width:${p}%;background:${VI[v].c}"></span>`).join('')}</div>
    <div>${Object.entries(s.mix).map(([v, p]) => `<span class="tg v-${v}">${v}(${VI[v].hj}) ${p}%</span>`).join('')}</div>
    <div class="tl" style="padding:8px 0">${s.steps.map(st => `<div class="it"><b>[${esc(st.y)}]</b> ${st.items.map(esc).join(' + ')}</div>`).join('')}</div>
    <div class="row"><button class="btn sm" data-act="addSenior" data-id="${s.id}">이 선배 활동 내 로드맵에 담기 (+)</button>
    <a href="${esc(s.url)}" target="_blank" rel="noopener" class="btn sm ghost" style="text-decoration:none">원문 포트폴리오 보기 ›</a></div></div>`).join('');
}
const newId = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ================= 프로필 ================= */
function openProfile() {
  const p = S.profile;
  $('#modal').innerHTML = `<h3>내 설정</h3>
    <label class="l">이름</label><input type="text" id="pName" maxlength="20" value="${esc(p.name)}">
    <label class="l">목표 진로</label><select class="f" id="pCareer">${Object.keys(S.cfg.careers).map(c => `<option ${c === p.career ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <label class="l">학년</label><select class="f" id="pGrade">${[1, 2, 3, 4].map(g => `<option ${g === Number(p.grade) ? 'selected' : ''} value="${g}">${g}학년</option>`).join('')}</select>
    <label class="l">목표 역량 태그 <small>쉼표로 구분 · 예: 글로벌, 데이터분석</small></label><input type="text" id="pGoals" value="${esc((p.goalTags || []).join(', '))}">
    <div class="row" style="margin-top:16px"><button class="btn" data-act="saveProfile">저장</button></div>`;
  $('#modal').classList.add('on'); $('#scrim').classList.add('on');
}

/* ================= 이벤트 위임 ================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab': go(d.t); break;
    case 'view': S.view = d.v; renderDash(); break;
    case 'axis': openAxis(d.v); break;
    case 'detail': closeAll(); setTimeout(() => openRecs(d.v, d.d), 120); break;
    case 'closeAll': closeAll(); break;
    case 'bm': {
      const r = S.records.find(x => x.Record_ID === d.id); if (!r) break;
      r.is_bookmarked = !r.is_bookmarked; el.textContent = r.is_bookmarked ? '★' : '☆';
      run('setBookmark', d.id, r.is_bookmarked).catch(() => { r.is_bookmarked = !r.is_bookmarked; el.textContent = r.is_bookmarked ? '★' : '☆'; toast('북마크 저장에 실패했어요'); });
      break;
    }
    case 'type': S.f.type = d.t; drawForm(); break;
    case 'chip': {
      const arr = S.f.sel[d.c], i = arr.indexOf(d.n);
      if (i >= 0) arr.splice(i, 1);
      else if (LIMIT[d.c] && arr.length >= LIMIT[d.c]) return toast(`${CAT[d.c]} 태그는 최대 ${LIMIT[d.c]}개까지 고를 수 있어요`);
      else arr.push(d.n);
      S.f.manual = false; drawChips(); break;
    }
    case 'custom': {
      const n = (prompt('추가할 태그 이름') || '').trim().slice(0, 20); if (!n) break;
      const v = (prompt('어느 가치에 속하나요? 인 / 의 / 예 / 지 중 입력') || '').trim();
      if (!VAL.includes(v)) return toast('인, 의, 예, 지 중 하나를 입력해 주세요');
      S.f.sel.method.push(n.replace(/[@,]/g, '') + '@' + v); drawChips(); break;
    }
    case 'primary': S.f.primary = d.v; S.f.manual = true; drawChips(); break;
    case 'submit': submit(); break;
    case 'coach': coach(); break;
    case 'selMs': S.sel = (S.sel && S.sel.id === d.id) ? null : { k: d.k, id: d.id }; renderRoad(); break;
    case 'place': placeAt(d.sem); break;
    case 'nodeClick': {
      if (S.conn.on) {
        if (!S.conn.first) S.conn.first = d.id;
        else if (S.conn.first !== d.id) {
          const l = { a: S.conn.first, b: d.id, t: S.conn.type }; S.rm.links.push(l); S.conn.first = null; saveRm(); toast(story(l));
        }
      } else S.sel = (S.sel && S.sel.id === d.id) ? null : { k: 'node', id: d.id };
      renderRoad(); break;
    }
    case 'rmNode': {
      e.stopPropagation();
      S.rm.nodes = S.rm.nodes.filter(n => n.id !== d.id); S.rm.links = S.rm.links.filter(l => l.a !== d.id && l.b !== d.id);
      saveRm(); renderRoad(); break;
    }
    case 'rmLink': S.rm.links.splice(Number(d.i), 1); saveRm(); renderRoad(); break;
    case 'connToggle': S.conn.on = !S.conn.on; S.conn.first = null; S.sel = null; renderRoad(); break;
    case 'linkType': S.conn.type = d.t; renderRoad(); break;
    case 'sub': S.sub = d.s; renderFind(); break;
    case 'filter': S.filter = d.f; renderFind(); break;
    case 'addPlan': {
      const n = S.notices.find(x => x.id === d.id); if (!n) break;
      S.rm.nodes.push({ id: newId(), title: n.title, cat: n.type, sem: null, kind: 'plan', tags: n.tags.map(t => t.replace(/^#/, '')) });
      saveRm(); toast('로드맵 활동함에 담았어요'); break;
    }
    case 'addSenior': {
      const s = S.seniors.find(x => x.id === d.id); if (!s) break;
      s.steps.forEach(st => st.items.forEach(it => S.rm.nodes.push({ id: newId(), title: it, cat: '선배 ' + st.y, sem: null, kind: 'plan', tags: [] })));
      saveRm(); toast('선배의 활동을 로드맵 활동함에 담았어요'); break;
    }
    case 'profile': openProfile(); break;
    case 'saveProfile': {
      try {
        S.profile = await run('saveProfile', { name: $('#pName').value, career: $('#pCareer').value, grade: $('#pGrade').value, goalTags: $('#pGoals').value.split(',').map(x => x.trim().replace(/^#/, '')).filter(Boolean) });
        S.rm.career = S.profile.career; saveRm(); header(); renderAll(); closeAll(); toast('설정을 저장했어요');
      } catch (er) { toast(er.message || '저장 실패'); }
      break;
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'semSel') { S.sem = e.target.value; if (S.view === 'sem') renderDash(); }
  if (e.target.id === 'startSel') { S.rm.career = e.target.value; S.profile.career = e.target.value; saveRm(); run('saveProfile', S.profile).catch(() => {}); header(); renderRoad(); }
});
/* 드래그 앤 드롭 (데스크톱) — 모바일은 탭으로 선택 후 학기 눌러 배치 */
document.addEventListener('dragstart', e => { const d = e.target.closest('[data-drag]'); if (d) e.dataTransfer.setData('text/plain', d.dataset.drag); });
document.addEventListener('dragover', e => { const c = e.target.closest('.col'); if (c) { e.preventDefault(); $$('.col.over').forEach(x => x !== c && x.classList.remove('over')); c.classList.add('over'); } });
document.addEventListener('drop', e => {
  const c = e.target.closest('.col'); if (!c) return; e.preventDefault();
  const [k, id] = (e.dataTransfer.getData('text/plain') || ':').split(':'); if (!id) return;
  S.sel = { k, id }; placeAt(c.dataset.sem);
});
document.addEventListener('dragend', () => $$('.col.over').forEach(x => x.classList.remove('over')));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
window.addEventListener('resize', () => { drawLinks(); if (S.chart) S.chart.resize(); });
window.addEventListener('load', init);
</script>
