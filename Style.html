<style>
:root{
  --g:#0b4a3a; --g2:#14684f; --gl:#e3efe9; --gold:#a88b3d; --goldl:#f3ecd6;
  --ink:#17211d; --mute:#64706a; --bg:#f2f4ef; --card:#fff; --line:#d9ded6;
  --in:#c9574c; --ui:#2f6aa8; --ye:#8d5fae; --ji:#16845f;
  --r:14px; --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Noto Serif KR','Batang',serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e8eee9;--mute:#9aa8a0;--bg:#0f1713;--card:#17231d;--line:#2a3a32;--gl:#17352b;--goldl:#2b2a1a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2,h3{font-family:var(--serif);margin:0;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:16px}
small{color:var(--mute);font-size:12px}

/* 헤더 */
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--g);color:#fff}
.who{display:flex;align-items:center;gap:10px;color:#fff;text-align:left;line-height:1.25}
.who small{display:block;color:#b9d4c8}
.seal{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--gold);color:#fff;
  font:700 20px var(--serif);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.top-r{display:flex;align-items:center;gap:8px}
.top select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 10px}
.top select option{color:#17211d}
.cnt{font-size:12px;background:var(--goldl);color:#5b4a14;border-radius:999px;padding:4px 10px;white-space:nowrap}

main{max-width:820px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.tab{display:none}.tab.on{display:block}
.boot{text-align:center;color:var(--mute);padding:60px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.empty{text-align:center;color:var(--mute);padding:28px 8px;border:1px dashed var(--line);border-radius:var(--r)}

/* 하단 탭 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 0}
.bar button i{font-style:normal;font-size:18px;line-height:1.1}
.bar button.on{color:var(--g2);font-weight:700}
.bar .plus i{display:grid;place-items:center;width:34px;height:34px;margin-top:-16px;border-radius:50%;
  background:var(--g);color:#fff;box-shadow:0 0 0 4px var(--card)}

/* 공통 컨트롤 */
.seg{display:flex;background:var(--gl);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:999px;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--g);color:#fff;font-weight:600}
.btn{background:var(--g);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:999px}
.btn.ghost{background:var(--gl);color:var(--g2)}
.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.5}
input[type=text],input[type=number],select.f,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:64px}
label.l{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
label.l small{font-weight:400}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;transition:background .15s}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip.add{border-style:dashed;color:var(--g2)}
.tg{display:inline-block;font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--gl);color:var(--g2);margin:0 4px 4px 0}
.tg.v-인{background:#f8e4e1;color:#9b3a30}.tg.v-의{background:#dfeaf6;color:#23558a}
.tg.v-예{background:#eee4f4;color:#6f4590}.tg.v-지{background:#d9efe5;color:#0f6a4a}

/* 대시보드 */
.persona{background:linear-gradient(135deg,var(--g) 0%,#0e5d49 100%);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px;
  display:flex;gap:14px;align-items:center}
.persona .big{font:700 22px/1.25 var(--serif)}
.persona small{color:#c6ddd2}
.persona .ico{font-size:34px}
.chartbox{position:relative;height:320px}
.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.axes button{border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:12px;background:var(--card)}
.axes b{display:block;font:700 18px var(--serif)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);justify-content:center;margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--g);vertical-align:middle;margin-right:5px}
.legend i.d{border-top:3px dashed var(--gold)}
.val{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.val:last-child{border:0}
.stamp{display:grid;place-items:center;width:44px;height:44px;border-radius:8px;color:#fff;font:700 22px var(--serif);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.gauge{height:10px;border-radius:99px;background:var(--gl);overflow:hidden;margin:6px 0 3px}
.gauge span{display:block;height:100%;border-radius:99px;transition:width .6s}
.lv{font-size:11px;font-weight:700;background:var(--goldl);color:#6a5514;border-radius:6px;padding:1px 7px;margin-left:6px}
.gap{display:flex;gap:10px;align-items:center;background:var(--goldl);border:1px solid #e3d6a4;border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.gap b{color:#5b4a14}

/* 바텀시트 / 모달 */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:820px;margin:0 auto;background:var(--card);
  border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;
  transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sheet::before{content:'';display:block;width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.modal{position:fixed;left:50%;top:50%;z-index:42;width:min(560px,calc(100% - 28px));max-height:84vh;overflow:auto;background:var(--card);
  border-radius:18px;padding:18px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.2s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.li{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.star-rec{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:14px 0}
.star-rec ul{margin:6px 0 0;padding-left:0;list-style:none;font-size:14px}
.star-rec li b{display:inline-block;min-width:78px;color:var(--g2);font-size:12px}

/* 기록 폼 */
.recbar{background:var(--goldl);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}
.prev{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:5;background:var(--g);color:#fff;border-radius:12px;padding:10px 14px;margin:14px 0;font-size:14px}
.prev b{font-family:var(--serif)}
.pickv{display:flex;gap:6px;margin-top:6px}
.pickv button{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 0;background:var(--card)}
.pickv button.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.coach{background:var(--gl);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.coach ul{margin:6px 0;padding-left:18px}

/* 로드맵 */
.rm-wrap{display:grid;grid-template-columns:150px 1fr;gap:10px}
.inbox{border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--card);max-height:420px;overflow:auto}
.ms{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--g2);border-radius:8px;padding:6px 8px;
  margin-bottom:6px;font-size:12px;background:var(--card);line-height:1.35}
.ms.plan{border-left-color:var(--gold);border-style:dashed;border-left-style:solid}
.ms.sel,.ms.pick{outline:2px solid var(--gold)}
.ms small{display:block}
.rm-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.rm-inner{position:relative;display:flex;min-width:860px;padding:14px 18px 50px 8px;align-items:flex-end}
.rm-start{flex:0 0 78px;align-self:center;text-align:center;font:700 12px/1.3 var(--serif);background:var(--g);color:#fff;border-radius:50%;
  width:78px;height:78px;display:grid;place-items:center;padding:6px;margin-right:6px}
.col{flex:1 0 110px;margin-top:calc((7 - var(--i)) * 16px);min-height:230px;border-left:1px dashed var(--line);padding:0 6px 0 6px}
.col.over{background:var(--gl)}
.col-h{display:block;width:100%;font-size:12px;font-weight:700;color:var(--g2);text-align:center;padding:4px 0 8px}
.rm-arrow{position:absolute;left:84px;right:10px;bottom:20px;height:6px;background:var(--g);border-radius:9px;transform-origin:left;transform:rotate(-4.2deg);z-index:0}
.rm-arrow::after{content:'';position:absolute;right:-10px;top:-8px;border-left:18px solid var(--g);border-top:11px solid transparent;border-bottom:11px solid transparent}
.rm-col-nodes{position:relative;z-index:2}
.node{position:relative;font-size:11.5px;line-height:1.3;background:var(--card);border:1px solid var(--g2);border-radius:8px;padding:5px 22px 5px 7px;margin-bottom:6px;width:100%;text-align:left}
.node.plan{border-style:dashed;border-color:var(--gold)}
.node.hl{background:var(--goldl);border-color:var(--gold)}
.node .x{position:absolute;right:3px;top:1px;color:var(--mute);padding:2px 5px}
.node.pick{outline:2px solid var(--gold)}
#rmSvg{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.story{border-left:3px solid var(--gold);background:var(--goldl);border-radius:0 10px 10px 0;padding:8px 12px;margin:6px 0;font-size:13.5px}
details.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
details.acc summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;font-family:var(--serif)}
details.acc summary::-webkit-details-marker{display:none}
.tl{padding:0 14px 12px}
.tl .it{padding:6px 0 6px 12px;border-left:2px solid var(--line);font-size:13.5px}
.tl .it.f{margin-left:16px;border-left-color:var(--gold)}
.tl .it.hl{background:var(--goldl);border-radius:0 8px 8px 0;border-left-color:var(--gold);font-weight:600}

/* 탐색 */
.notice{display:grid;grid-template-columns:62px 1fr;gap:12px}
.dd{display:grid;place-items:center;align-content:center;border-radius:12px;background:var(--gl);color:var(--g2);font:700 17px var(--serif);height:62px}
.dd.hot{background:#f8e4e1;color:#a53a2f}
.why{font-size:12.5px;color:var(--g2);margin:2px 0 6px}
.mix{display:flex;height:8px;border-radius:9px;overflow:hidden;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,20px);background:#17211d;color:#fff;
  border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .rm-wrap{grid-template-columns:1fr}
  .inbox{max-height:170px}
  .chartbox{height:280px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
